<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>08 — founding memberships</title>
  <link rel="stylesheet" href="ig.css">
  <style>
    .tier-list { gap: 22px; margin-top: 56px; }
    .tier { padding: 32px 48px; }
    .z { margin-top: -60px; }
    .tier-lilac { background: var(--lilac); color: var(--ink); }
    .tier-orange { background: var(--orange); color: var(--cream); }
    .tier-pink { background: var(--pink); color: var(--ink); }
  </style>
</head>
<body>
  <div class="frame bg-cream-2">
    <div class="z">
      <p class="eyebrow accent-orange">Membership</p>
      <h1 class="headline">Founding rates.<br>Limited at launch.</h1>
      <div class="tier-list">
        <div class="tier tier-lilac">
          <h2>Private</h2>
          <p>1-on-1 · 25 or 50 min</p>
        </div>
        <div class="tier tier-orange">
          <h2>Membership</h2>
          <p>Weekly · best rate</p>
        </div>
        <div class="tier tier-pink">
          <h2>Duo</h2>
          <p>Stretch with a partner</p>
        </div>
      </div>
    </div>
    <div class="meta">
      <span class="mark">TLC</span>
      <span class="site">www.length.club</span>
    </div>
  </div>
</body>
</html>
