<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>09 — waitlist CTA</title>
  <link rel="stylesheet" href="ig.css">
  <style>
    .frame { display: flex; }
    .rings { width: 820px; height: 820px; bottom: -300px; right: -300px; opacity: 0.4; }
    .z { display: flex; flex-direction: column; align-items: flex-start; }
  </style>
</head>
<body>
  <div class="frame bg-orange">
    <svg class="motif rings" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="#F1EBE1" stroke-width="1">
        <circle cx="100" cy="100" r="18"/>
        <circle cx="100" cy="100" r="33"/>
        <circle cx="100" cy="100" r="48"/>
        <circle cx="100" cy="100" r="63"/>
        <circle cx="100" cy="100" r="78"/>
        <circle cx="100" cy="100" r="93"/>
      </g>
    </svg>
    <div class="z">
      <p class="eyebrow">Waitlist open</p>
      <h1 class="headline headline-xl">Be first<br>in line.</h1>
      <p class="sub">Founding rates, first booking access and the opening date — before anyone else.</p>
      <span class="cta-pill">length.club
        <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>
    <div class="meta">
      <span class="mark">TLC</span>
      <span class="site">Zürich · 2026</span>
    </div>
  </div>
</body>
</html>
