<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Office poster (EN) — A3 portrait</title>
  <link rel="stylesheet" href="print.css">
  <style>
    @page { size: 297mm 420mm; margin: 0; }

    .page { display: flex; flex-direction: column; padding: 18mm 20mm 18mm; }
    .rings { width: 300mm; height: 300mm; top: -95mm; right: -105mm; color: var(--cream); opacity: 0.45; }

    .wordmark { gap: 5mm; }
    .wordmark .mark { font-size: 46pt; }
    .wordmark .stack { font-size: 12pt; }

    .main { margin-top: auto; }
    .eyebrow { font-size: 16pt; margin-bottom: 7mm; }
    .headline { font-size: 100pt; letter-spacing: -0.035em; line-height: 1.02; }
    .sub { font-size: 20pt; line-height: 1.4; letter-spacing: -0.01em; margin: 6mm 0 0; max-width: 190mm; }

    /* ===== EDIT HERE: date, time and room are the text inside .when ===== */
    .when {
      display: inline-block;
      margin: 9mm 0 0;
      padding: 4.5mm 10mm 5mm;
      border-radius: 999px;
      background: var(--ink);
      color: var(--cream);
      font-size: 28pt;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }

    .facts { list-style: none; margin: 9mm 0 0; padding: 0; }
    .facts li { display: flex; align-items: center; gap: 7mm; font-size: 28pt; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; padding: 2.8mm 0; border-top: 0.4mm solid rgba(241,235,225,0.55); }
    .facts li:last-child { border-bottom: 0.4mm solid rgba(241,235,225,0.55); }
    .facts .dot { width: 8mm; height: 8mm; flex: none; }

    .cta { margin-top: 10mm; background: var(--cream); color: var(--ink); border-radius: 10mm; padding: 9mm 11mm; display: flex; align-items: center; gap: 14mm; }
    .qrbox { text-align: center; flex: none; }
    .qrbox .qr { width: 58mm; height: 58mm; }
    .qrbox .url { margin: 4mm 0 0; font-size: 17pt; font-weight: 500; letter-spacing: -0.01em; }
    .cta h2 { margin: 0; font-size: 48pt; font-weight: 500; letter-spacing: -0.035em; line-height: 1.05; }
    .cta p { margin: 6mm 0 0; font-size: 20pt; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="page a3 bg-orange">
    <svg class="motif rings" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="0.5">
        <circle cx="100" cy="100" r="18"/>
        <circle cx="100" cy="100" r="33"/>
        <circle cx="100" cy="100" r="48"/>
        <circle cx="100" cy="100" r="63"/>
        <circle cx="100" cy="100" r="78"/>
        <circle cx="100" cy="100" r="93"/>
      </g>
    </svg>

    <div class="wordmark z">
      <span class="mark">TLC</span>
      <span class="stack">The<br>Length<br>Club</span>
    </div>

    <div class="main z">
      <p class="eyebrow">Office stretch day</p>
      <h1 class="headline">Get<br>stretched.<br>Right here.</h1>
      <p class="sub">A practitioner stretches you on a portable table.</p>

      <!-- ===== EDIT HERE: replace the placeholders with your date, time and room ===== -->
      <p class="when" id="when">[Date] · [Time] · [Room]</p>

      <ul class="facts">
        <li><svg class="dot" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>15–25 minutes</li>
        <li><svg class="dot" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Stay in your clothes</li>
        <li><svg class="dot" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>No flexibility needed</li>
      </ul>
    </div>

    <div class="cta z">
      <div class="qrbox">
        <img class="qr" src="qr/book.svg" alt="QR code: length.club/book">
        <p class="url">length.club/book</p>
      </div>
      <div>
        <h2>Book<br>your slot</h2>
        <p>Scan the code and pick a free time.</p>
      </div>
    </div>
  </div>
</body>
</html>
